
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxsus taklifnoma</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #29205b, #080b1b 65%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

.card {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  padding: 65px 25px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: appear 1.5s ease;
}

@keyframes appear {
  from {opacity: 0; transform: translateY(35px);}
  to {opacity: 1; transform: translateY(0);}
}

.star {
  color: #f5d78e;
  font-size: 35px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from {text-shadow: 0 0 5px gold;}
  to {text-shadow: 0 0 25px gold;}
}

.small {
  color: #c5b8ed;
  letter-spacing: 5px;
  font-size: 12px;
  margin: 25px 0;
}

h1 {
  color: #f6d88e;
  font-size: 38px;
  margin: 18px 0;
}

p {
  line-height: 1.8;
  color: #ddd9ee;
  margin: 12px 0;
}

.line {
  width: 75%;
  height: 1px;
  background: linear-gradient(90deg, transparent, gold, transparent);
  margin: 25px;
}

.info {
  background: #ffffff12;
  border: 1px solid #ffffff30;
  border-radius: 18px;
  padding: 20px;
  width: 100%;
  margin: 20px 0;
  backdrop-filter: blur(10px);
}

button {
  border: none;
  padding: 15px 25px;
  border-radius: 30px;
  margin: 10px;
  background: linear-gradient(120deg, #f3d38b, #bd8c3b);
  color: #17101e;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

#music {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 5;
  background: #ffffff20;
  color: white;
  border: 1px solid #ffffff55;
}

footer {
  font-size: 12px;
  color: #a9a1c5;
  margin-top: 35px;
}

</style>
</head>

<body>

<button id="music" onclick="toggleMusic()">♫ Musiqa: OFF</button>

<div class="card">

  <div class="star">✦</div>

  <div class="small">SIZNI TAKLIF QILAMIZ</div>

  <h1>Maxsus taklifnoma</h1>

  <div class="line"></div>

  <p>
    Sizni biz uchun qadrli bo‘lgan
    unutilmas kunimizga taklif qilamiz!
  </p>

  <div class="info">
    <p>✦ TADBIR ✦</p>
    <h2 id="event">Maxsus tadbir</h2>

    <div class="line"></div>

    <p>📅 Sana: 25-dekabr, 2026</p>
    <p>🕒 Vaqt: 18:00</p>
    <p>📍 Manzil: Namangan</p>
  </div>

  <p>Ushbu kunni biz bilan birga nishonlang!</p>

  <button onclick="respond()">Men qatnashaman ✨</button>

  <button onclick="share()">Taklifnomani ulashish ↗</button>

  <footer>
    Sizni kutib qolamiz ❤️
  </footer>

</div>

<script>
let audioContext;
let oscillator;
let musicOn = false;

function toggleMusic() {
  const btn = document.getElementById("music");

  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (!musicOn) {
    audioContext.resume();
    oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 261.63;
    gain.gain.value = 0.025;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();

    musicOn = true;
    btn.innerText = "♫ Musiqa: ON";
  } else {
    oscillator.stop();
    musicOn = false;
    btn.innerText = "♫ Musiqa: OFF";
  }
}

function respond() {
  alert("Taklifingiz uchun rahmat! ❤️");
}

function share() {
  if (navigator.share) {
    navigator.share({
      title: "Maxsus taklifnoma",
      text: "Sizni tadbirimizga taklif qilamiz!",
      url: location.href
    });
  } else {
    alert("Havola: " + location.href);
  }
}
</script>

</body>
</html>
